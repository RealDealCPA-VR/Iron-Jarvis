name: Tests

# The offline suite + dashboard build on every push/PR. This is the single
# source of truth for "how many tests are there and do they pass" — the README
# carries the badge instead of a hand-edited count (which drifted three times:
# 254 → 687 → 971 all claimed at once in different files).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest # mirrors the packaged product (ConPTY terminals etc.)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Sync Python deps
        run: uv sync --extra dev

      - name: Run the offline suite
        shell: bash
        run: |
          # -n auto: one worker per core. This suite is the release gate, so
          # its wall time is time the user waits for an update (23min serially
          # on this runner). Measured parallel-safe over three local runs:
          # 4814 passed / 2 skipped every time, identical to serial.
          uv run pytest -q --no-header -n auto | tee pytest-out.txt
          tail -1 pytest-out.txt >> "$GITHUB_STEP_SUMMARY"

  dashboard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dashboard deps
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      # THE ADD-ON IS BUILT BEFORE THE DASHBOARD SUITE, and the ordering is
      # load-bearing (v1.242.0). `__tests__/sidepanel-runtime-v1242.test.ts`
      # EXECUTES the built `extensions/chrome/dist/sidepanel.js` against its real
      # HTML — the only test anywhere that runs the sidebar's one script — and it
      # FAILS rather than skips when those files are absent, because a test that
      # skips when its subject is missing is a test that cannot fail. `dist/` is
      # gitignored, so on a fresh checkout it exists only because this step ran.
      #
      # It duplicates two steps from the `browser-addon` job below on purpose: that
      # job answers "does the add-on build", this one answers "does the panel it
      # produced still run", and a job that needed the other job's filesystem would
      # need an artifact upload to share one.
      - name: Install browser add-on deps
        working-directory: extensions/chrome
        run: pnpm install --frozen-lockfile

      - name: Build the browser add-on (the panel runtime test executes it)
        working-directory: extensions/chrome
        run: node scripts/build.mjs

      - name: Unit tests (vitest)
        working-directory: dashboard
        run: pnpm test

      - name: Typecheck
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Production build
        working-directory: dashboard
        run: pnpm build

  # The browser add-on (v1.239.0). Mirrors the identically-named steps in the
  # release gate (.github/workflows/release.yml, job `suite`), so a change that
  # breaks the add-on is red on a PR rather than at publish time.
  #
  # Three failures live in this one command, and none of them is a unit test:
  #   * the pinned extension id in manifest.json drifting from
  #     src/iron_jarvis/browser/identity.py — the daemon's origin guard then
  #     refuses the real add-on with close 1008 and nothing names the mismatch;
  #   * a type error, since esbuild strips types without checking them;
  #   * a bundle manifest.json names that no build actually produced, which
  #     Chrome reports as "Service worker registration failed", naming no file.
  #
  # Ubuntu: this is a bundler and a typechecker, both platform-independent, and
  # the release gate already runs the same command on the windows runner the
  # product ships for.
  browser-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install browser add-on deps
        working-directory: extensions/chrome
        run: pnpm install --frozen-lockfile

      - name: Build + typecheck the browser add-on, and verify the pinned ID
        working-directory: extensions/chrome
        run: node scripts/build.mjs

  # Syntax-check the Electron entry points. A parse error in the supervisor /
  # tray / updater / IPC (main.js, preload.js, ...) reaches users only at launch
  # otherwise — no test covers desktop/. Pure `node --check`, no deps needed.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check Electron entry points
        working-directory: desktop
        run: |
          node --check main.js
          node --check preload.js
          node --check spotlight-preload.js
          node --check windowState.js
          node --check afterPack.js
          node --check sign.js
