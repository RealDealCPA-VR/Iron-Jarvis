<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora</title>
<!--
  Aurora: soft curtains of colour that drift slowly across the dark, each with
  faint vertical folds hanging below its edge.
  Contract: one self-contained file, no network. Colours come ONLY from
  location.hash (bg, accent, second, mode) and are drawn with plain source-over
  alpha. One requestAnimationFrame loop capped at 30 fps; paused / still by a
  {type:"ij-bg"} message from the parent, by reduced motion, or a hidden tab.
-->
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #070809; }
canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; filter: blur(5px); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var ID = "aurora";
  var SCALE = 0.5;   // half-resolution backing store, smoothed up by CSS
  var STILL_T = 30;  // seconds: the moment a still frame shows
  var TAU = Math.PI * 2;

  /* ---------- parameters: ONLY from location.hash ---------- */
  var HEX = /^[0-9a-fA-F]{6}$/;
  var P = null;
  function hexRGB(h) {
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function readParams() {
    var raw = {};
    String(location.hash || "").replace(/^#/, "").split("&").forEach(function (pair) {
      var i = pair.indexOf("=");
      if (i < 1) return;
      var v = pair.slice(i + 1);
      try { v = decodeURIComponent(v); } catch (err) { /* keep it as typed */ }
      raw[pair.slice(0, i)] = v.replace(/^%23/i, "").replace(/^#/, "");
    });
    function pick(k, d) {
      var v = Object.prototype.hasOwnProperty.call(raw, k) ? raw[k] : "";
      return HEX.test(v) ? v : d;
    }
    var accent = pick("accent", "22d3ee");
    var light = raw.mode === "light";
    P = {
      accent: hexRGB(accent),
      second: hexRGB(pick("second", accent)),
      bg: hexRGB(pick("bg", "070809")),
      light: light,
      gain: light ? 1.15 : 1
    };
    var bg = rgba(P.bg, 1);
    document.documentElement.style.background = bg;
    document.body.style.background = bg;
  }
  function rgba(c, a) {
    a = a < 0 ? 0 : a > 1 ? 1 : a;
    return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a.toFixed(3) + ")";
  }
  function mix(a, b, f) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * f),
      Math.round(a[1] + (b[1] - a[1]) * f),
      Math.round(a[2] + (b[2] - a[2]) * f)
    ];
  }
  // A tiny seeded PRNG so every frame (and the still frame) is reproducible.
  function prng(seed) {
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- canvas ---------- */
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 1, H = 1, K = 1;  // backing size, backing pixels per CSS pixel
  function resize() {
    K = Math.min(window.devicePixelRatio || 1, 1) * SCALE;
    W = Math.max(1, Math.round(window.innerWidth * K));
    H = Math.max(1, Math.round(window.innerHeight * K));
    canvas.width = W;
    canvas.height = H;
    layout();
  }

  /* ---------- the effect ---------- */
  var BANDS = [];
  (function () {
    var r = prng(20261030);
    for (var i = 0; i < 5; i++) {
      BANDS.push({
        y: 0.16 + i * 0.14 + r() * 0.04,  // centre line, as a fraction of height
        amp: 0.04 + r() * 0.05,            // how far it sways
        k1: 0.8 + r() * 1.2,               // cycles across the width
        k2: 1.8 + r() * 2.2,
        s1: 0.012 + r() * 0.018,           // cycles per second
        s2: 0.008 + r() * 0.014,
        p1: r() * TAU,
        p2: r() * TAU,
        thick: 0.09 + r() * 0.07,          // curtain thickness (of height)
        tint: r(),                         // where it sits between accent and second
        breath: 0.03 + r() * 0.04          // brightness cycles per second
      });
    }
  })();
  // Soft falloff: the same edge stroked wide and faint, then narrower and
  // stronger ([width as a share of the band, alpha]); CSS blurs the steps away.
  var PASSES = [[1.00, 0.10], [0.80, 0.11], [0.62, 0.13], [0.46, 0.15],
                [0.32, 0.17], [0.20, 0.20], [0.10, 0.24]];

  function layout() { /* everything scales with W and H */ }

  function yAt(b, x, t) {
    var u = x / Math.max(W, H * 1.5);  // waves stay broad in a narrow window
    return H * (b.y +
      b.amp * Math.sin(TAU * (u * b.k1 + t * b.s1) + b.p1) +
      b.amp * 0.5 * Math.sin(TAU * (u * b.k2 - t * b.s2) + b.p2));
  }

  function draw(t) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = rgba(P.bg, 1);
    ctx.fillRect(0, 0, W, H);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    var step = Math.max(4, Math.round(W / 80));
    var x, y;
    for (var i = 0; i < BANDS.length; i++) {
      var b = BANDS[i];
      var th = b.thick * H;
      var breathe = (0.8 + 0.2 * Math.sin(TAU * t * b.breath + b.p1)) * P.gain;

      // The curtain's flowing edge.
      var path = new Path2D();
      for (x = -step; x <= W + step; x += step) {
        y = yAt(b, x, t);
        if (x === -step) path.moveTo(x, y); else path.lineTo(x, y);
      }
      // Colour drifts along the band between accent and second.
      var g = ctx.createLinearGradient(0, 0, W, 0);
      for (var s = 0; s <= 4; s++) {
        var f = 0.5 + 0.5 * Math.sin(TAU * (t * 0.012 + s * 0.21 + b.tint));
        var a = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin(TAU * (t * 0.017 + s * 0.33) + b.p2));
        g.addColorStop(s / 4, rgba(mix(P.accent, P.second, f), a));
      }
      ctx.strokeStyle = g;
      for (var p = 0; p < PASSES.length; p++) {
        ctx.globalAlpha = PASSES[p][1] * breathe;
        ctx.lineWidth = th * PASSES[p][0];
        ctx.stroke(path);
      }

      // Faint vertical folds hanging below the edge.
      var col = mix(P.accent, P.second, b.tint);
      var top = H * (b.y - b.amp * 1.5) - th * 0.3;
      var bottom = H * (b.y + b.amp * 1.5) + th * 1.6;
      var vg = ctx.createLinearGradient(0, top, 0, bottom);
      vg.addColorStop(0, rgba(col, 0));
      vg.addColorStop(0.3, rgba(col, 1));
      vg.addColorStop(1, rgba(col, 0));
      ctx.strokeStyle = vg;
      ctx.lineWidth = Math.max(1, step * 0.6);
      for (x = 0; x <= W; x += step * 2) {
        var w = Math.sin(TAU * (x / Math.max(W, H * 1.5) * 7 + t * 0.02) + b.p2 * 3);
        if (w <= 0.2) continue;
        ctx.globalAlpha = 0.3 * ((w - 0.2) / 0.8) * breathe;
        y = yAt(b, x, t);
        ctx.beginPath();
        ctx.moveTo(x, y - th * 0.25);
        ctx.lineTo(x, y + th * 1.3);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- motion control ---------- */
  var FRAME_MS = 1000 / 30;
  var time = STILL_T, last = 0, raf = 0, state = "", readySent = false;
  var run = true, still = false;
  var mq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;

  function frame(t) {
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    draw(t);
    if (!readySent) {
      readySent = true;
      try { window.parent.postMessage({ type: "ij-bg-ready", id: ID }, "*"); } catch (err) { /* no parent */ }
    }
  }
  function loop(now) {
    raf = requestAnimationFrame(loop);
    if (last && now - last < FRAME_MS - 4) return;  // cap at ~30 fps
    var dt = last ? Math.min(now - last, 100) : 0;
    last = now;
    time += dt / 1000;
    frame(time);
  }
  function setState(s) {
    if (s === state) return;
    state = s;
    document.documentElement.dataset.state = s;
  }
  function decide() {
    var paused = !run || document.hidden;
    var holdStill = still || !!(mq && mq.matches);
    var animate = !paused && !holdStill;
    if (animate) {
      if (!raf) { last = 0; raf = requestAnimationFrame(loop); }
    } else if (raf) {
      cancelAnimationFrame(raf);
      raf = 0;
    }
    var next = animate ? "running" : paused ? "paused" : "still";
    if (next === "still" && state !== "still") { time = STILL_T; frame(STILL_T); }
    setState(next);
  }
  function redraw() {
    if (state !== "running") frame(state === "still" ? STILL_T : time);
  }

  window.addEventListener("message", function (e) {
    if (e.source !== window.parent) return;
    var m = e.data;
    if (!m || m.type !== "ij-bg") return;
    if (typeof m.run === "boolean") run = m.run;
    if (typeof m.still === "boolean") still = m.still;
    decide();
  });
  document.addEventListener("visibilitychange", decide);
  if (mq) {
    if (mq.addEventListener) mq.addEventListener("change", decide);
    else if (mq.addListener) mq.addListener(decide);
  }
  window.addEventListener("hashchange", function () { readParams(); layout(); redraw(); });
  var resizeTimer = 0;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { resize(); redraw(); }, 150);
  });

  readParams();
  resize();
  frame(STILL_T);
  decide();
})();
</script>
</body>
</html>
