id: cloud-metadata-endpoint-access
version: 1
title: Cloud metadata endpoint queried
description: >
  The agent asked a cloud machine's built-in metadata service
  (169.254.169.254, metadata.google.internal, metadata.azure.com) for its
  details - the place a cloud server hands out its own access keys. Pinging
  the address or reading AWS documentation about it does not count.
severity: high
status: stable
posture: detect
category: external-access
adapted_from: agent-beacon cloud-metadata-endpoint-access (MIT, Asymptote Labs)
taxonomy:
  owasp_llm: LLM06
  mitre_atlas: AML.T0024

match:
  any:
    - action: command.executed
      command:
        regex:
          - '\b(curl|wget|iwr|irm|Invoke-WebRequest|Invoke-RestMethod|Net\.WebClient|http|httpie)\b'
          - '(169\.254\.169\.254|fd00:ec2::254|metadata\.google\.internal|metadata\.goog\b|metadata\.azure\.com|/latest/meta-data|/computeMetadata/|/metadata/identity/oauth2/token)'
    - action: network.request
      url:
        regex: '^[a-z]+://(169\.254\.169\.254|\[?fd00:ec2::254\]?|metadata\.google\.internal|metadata\.goog|metadata\.azure\.com)([:/]|$)'

emit:
  reason: "Cloud instance metadata endpoint was queried"

tests:
  - name: curl_aws_metadata
    verdict: match
    events:
      - {action: command.executed, command: 'curl http://169.254.169.254/latest/meta-data/iam/security-credentials/'}
  - name: powershell_azure_imds
    verdict: match
    events:
      - {action: command.executed, command: 'Invoke-RestMethod -Headers @{Metadata="true"} -Uri "http://169.254.169.254/metadata/instance?api-version=2021-02-01"'}
  - name: web_fetch_gcp_metadata
    verdict: match
    events:
      - {action: network.request, url: 'http://metadata.google.internal/computeMetadata/v1/'}
  - name: curl_latest_news
    verdict: no_match
    events:
      - {action: command.executed, command: 'curl -s https://api.example.com/latest/news'}
  - name: ping_is_not_a_request
    verdict: no_match
    events:
      - {action: command.executed, command: 'ping 169.254.169.254'}
  - name: reading_aws_docs
    verdict: no_match
    events:
      - {action: network.request, url: 'https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-data-retrieval.html'}
