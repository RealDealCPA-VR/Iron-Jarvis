id: password-manager-db-read
version: 1
title: Agent read a password-manager vault
description: >
  The agent opened or copied a password manager's vault - a KeePass .kdbx
  database, a pass(1) store, or 1Password / Bitwarden / LastPass local data.
  A vault file is every password the person owns in one place.
severity: high
status: stable
posture: detect
category: credential-access
adapted_from: agent-beacon password-manager-db-read (MIT, Asymptote Labs)
taxonomy:
  owasp_llm: LLM02
  mitre_atlas: AML.T0024

match:
  any:
    - action: file.read
      path:
        regex_any:
          - '\.kdbx$'
          - '(^|[\\/])\.password-store[\\/]'
          - '(^|[\\/])(\.1password|1Password)[\\/]'
          - '(^|[\\/])(Bitwarden|\.bitwarden)[\\/].*\.(json|sqlite|db)$'
          - '(^|[\\/])(\.lastpass|LastPass)[\\/]'
          - '(^|[\\/])KeePass(XC)?[\\/].*\.(kdbx|key|keyx)$'
    - action: command.executed
      command:
        regex: '\b(copy|Copy-Item|cp|cat|type|Get-Content|gc|scp|curl|iwr|irm|Invoke-WebRequest|Invoke-RestMethod|Compress-Archive|tar|robocopy|xcopy)\b[^|;&\n]*\.kdbx\b'

emit:
  reason: "Agent read or copied a password-manager vault"

tests:
  - name: read_keepass_db
    verdict: match
    events:
      - {action: file.read, path: 'C:\Users\me\Documents\Passwords.kdbx'}
  - name: read_bitwarden_data
    verdict: match
    events:
      - {action: file.read, path: 'C:\Users\me\AppData\Roaming\Bitwarden\data.json'}
  - name: copy_keepass_to_share
    verdict: match
    events:
      - {action: command.executed, command: 'Copy-Item "$env:USERPROFILE\Documents\vault.kdbx" \\server\share\'}
  - name: notes_about_the_format
    verdict: no_match
    events:
      - {action: file.read, path: 'C:\Users\me\Documents\kdbx-format-notes.md'}
  - name: onepassword_export_howto
    verdict: no_match
    events:
      - {action: file.read, path: 'C:\Users\me\Documents\1Password-export-howto.txt'}
  - name: keepass_setup_doc_command
    verdict: no_match
    events:
      - {action: command.executed, command: 'Get-Content .\docs\keepass-setup.md'}
