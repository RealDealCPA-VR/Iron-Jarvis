id: credential-file-read
version: 1
title: Agent read a credential-bearing file
description: >
  The agent opened a file that holds a secret: a .env file, an SSH or PuTTY
  private key, AWS or Azure sign-in files, a Kubernetes config, a git
  credential store, or a .netrc/.pgpass. Only the secret itself counts, so
  .env.example, id_rsa.pub and .aws\config do not.
severity: high
status: stable
posture: detect
category: credential-access
adapted_from: agent-beacon credential-file-read + kubernetes-secret-file-read (MIT, Asymptote Labs)
taxonomy:
  owasp_llm: LLM02
  mitre_atlas: AML.T0024

match:
  any:
    - action: file.read
      path:
        regex_any:
          - '(^|[\\/])\.env(\.[^\\/]+)?$'
          - '(^|[\\/])\.aws[\\/]credentials$'
          - '(^|[\\/])id_(rsa|ed25519|ecdsa|dsa)$'
          - '\.ppk$'
          - '(^|[\\/])\.ssh[\\/][^\\/]+\.pem$'
          - '(^|[\\/])(\.git-credentials|\.netrc|_netrc|\.pgpass)$'
          - '(^|[\\/])\.config[\\/]git[\\/]credentials$'
          - '(^|[\\/])credentials\.(json|toml)$'
          - '(^|[\\/])\.azure[\\/](accessTokens\.json|msal_token_cache\.(json|bin)|service_principal_entries\.json)$'
          - '(^|[\\/])\.kube[\\/]config(-[^\\/]+)?$'
          - '(^|[\\/])kubeconfig(\.ya?ml)?$'
        not_regex: '(^|[\\/])\.env\.(example|sample|template|dist|defaults?)$'
    - action: command.executed
      command:
        regex_any:
          # a reader verb (not a `cat > file` write), the secret inside the SAME
          # command segment, never past a `#` comment or a `>` redirect
          - '\b(cat|type|more|less|head|tail|gc|Get-Content|base64|certutil|Select-String|sls|findstr)\b(?![ \t]*>)[^|;&\n#>]*(?:^|[\s"''\\/=@])(\.env(\.(?!(example|sample|template|dist|defaults?)\b)[\w.-]+)?|id_(rsa|ed25519|ecdsa|dsa)|\.git-credentials|[._]netrc|\.pgpass|[\w.-]+\.ppk|kubeconfig|\.aws[\\/]credentials|\.config[\\/]git[\\/]credentials|credentials\.(json|toml)|\.kube[\\/]config|\.azure[\\/](accessTokens\.json|msal_token_cache\.\w+))(?=$|[\s"'';|&)>])'
          # a copy whose SOURCE (first argument) is the secret
          - '\b(copy|Copy-Item|cpi|cp|scp|xcopy|robocopy)\b(\s+-\S+)*\s+["'']?(?:[^\s"'';|&\n]*[\\/])?(\.env|id_(rsa|ed25519|ecdsa|dsa)|\.git-credentials|[._]netrc|\.pgpass|[\w.-]+\.ppk|kubeconfig|\.aws[\\/]credentials|\.kube[\\/]config)["'']?\s'
          # code that opens it: Python open()/Path().read_*, .NET File::Read*
          - '(\bopen\(\s*(?:os\.path\.expanduser\(\s*)?[rRbBuUfF]{0,2}|::(ReadAllText|ReadAllBytes|ReadAllLines|OpenRead|OpenText)\(\s*|\bPath\(\s*[rR]?)["''](?:[^"''\n]*[\\/])?(\.env(\.(?!(example|sample|template|dist|defaults?)["''])[\w.-]+)?|id_(rsa|ed25519|ecdsa|dsa)|\.git-credentials|[._]netrc|\.pgpass|[\w.-]+\.ppk|kubeconfig|credentials\.(json|toml)|\.aws[\\/]credentials|\.kube[\\/]config)["'']\s*\)?\s*(,\s*[rRbB]?["'']r[bt]?["'']\s*)?\)'

emit:
  reason: "Agent read a credential-bearing file (a secret store member)"

tests:
  - name: read_dotenv_windows
    verdict: match
    events:
      - {action: file.read, path: 'C:\Users\me\project\.env'}
  - name: read_dotenv_production
    verdict: match
    events:
      - {action: file.read, path: 'C:\Users\me\project\.env.production'}
  - name: read_ssh_key_posix
    verdict: match
    events:
      - {action: file.read, path: '/home/me/.ssh/id_ed25519'}
  - name: read_aws_credentials_userprofile
    verdict: match
    events:
      - {action: file.read, path: '%USERPROFILE%\.aws\credentials'}
  - name: read_kube_config
    verdict: match
    events:
      - {action: file.read, path: 'C:\Users\me\.kube\config'}
  - name: read_azure_token_cache
    verdict: match
    events:
      - {action: file.read, path: 'C:\Users\me\.azure\msal_token_cache.json'}
  - name: read_putty_key
    verdict: match
    events:
      - {action: file.read, path: 'D:\keys\prod-server.ppk'}
  - name: type_aws_credentials_cmd
    verdict: match
    events:
      - {action: command.executed, command: 'type %USERPROFILE%\.aws\credentials'}
  - name: get_content_dotenv_powershell
    verdict: match
    events:
      - {action: command.executed, command: 'Get-Content -Raw .\.env.production'}
  - name: cat_ssh_key
    verdict: match
    events:
      - {action: command.executed, command: 'cat ~/.ssh/id_rsa'}
  - name: env_example_is_not_a_secret
    verdict: no_match
    events:
      - {action: file.read, path: 'C:\Users\me\project\.env.example'}
  - name: public_key_is_not_a_secret
    verdict: no_match
    events:
      - {action: file.read, path: 'C:\Users\me\.ssh\id_rsa.pub'}
  - name: aws_config_is_not_credentials
    verdict: no_match
    events:
      - {action: file.read, path: 'C:\Users\me\.aws\config'}
  - name: get_content_env_example
    verdict: no_match
    events:
      - {action: command.executed, command: 'Get-Content .env.example'}
  - name: cat_environment_doc
    verdict: no_match
    events:
      - {action: command.executed, command: 'cat docs/environment.md'}
  - name: writing_dotenv_is_not_reading_it
    verdict: no_match
    events:
      - {action: file.write, path: 'C:\Users\me\project\.env'}
  - name: copy_item_ssh_key
    verdict: match
    events:
      - {action: command.executed, command: 'Copy-Item -Path C:\Users\me\.ssh\id_rsa -Destination C:\Temp\k'}
  - name: copy_ssh_key_cmd
    verdict: match
    events:
      - {action: command.executed, command: 'copy %USERPROFILE%\.ssh\id_rsa C:\Temp\'}
  - name: select_string_path_dotenv
    verdict: match
    events:
      - {action: command.executed, command: 'Select-String -Path .env -Pattern KEY'}
  - name: findstr_dotenv
    verdict: match
    events:
      - {action: command.executed, command: 'findstr /i secret .env'}
  - name: python_open_dotenv
    verdict: match
    events:
      - {action: command.executed, command: 'python -c "print(open(''.env'').read())"'}
  - name: dotnet_read_all_text_dotenv
    verdict: match
    events:
      - {action: command.executed, command: '[IO.File]::ReadAllText(''C:\app\.env'')'}
  - name: run_code_reads_aws_credentials
    verdict: match
    events:
      - {action: command.executed, tool: run_code, command: "import os\ndata = open(os.path.expanduser('~/.aws/credentials')).read()\nprint(len(data))"}
  - name: heredoc_write_mentioning_credentials
    verdict: no_match
    events:
      - {action: command.executed, command: "cat > NOTES.md <<'EOF'\nKeep the AWS credentials in the vault; type your credentials only at the prompt.\nEOF"}
  - name: head_with_comment_mentioning_credentials
    verdict: no_match
    events:
      - {action: command.executed, command: 'head -5 README.md # check the credentials section'}
  - name: copy_env_example_to_env
    verdict: no_match
    events:
      - {action: command.executed, command: 'cp .env.example .env'}
  - name: python_open_env_example
    verdict: no_match
    events:
      - {action: command.executed, command: 'python -c "print(open(''.env.example'').read())"'}
  - name: python_writes_dotenv
    verdict: no_match
    events:
      - {action: command.executed, command: 'python -c "open(''.env'', ''w'').write(''X=1'')"'}
  - name: grep_word_credentials_in_source
    verdict: no_match
    events:
      - {action: command.executed, command: 'findstr /s credentials *.md'}
  - name: comment_names_a_secret_path
    verdict: no_match
    events:
      - {action: command.executed, command: 'head -5 README.md  # the keys live in ~/.aws/credentials'}
  - name: heredoc_writing_fixture_commands
    verdict: no_match
    events:
      - {action: command.executed, command: "cat > cases.yaml <<'EOF'\n- type %USERPROFILE%\\.aws\\credentials\n- cat ~/.ssh/id_rsa\nEOF\necho written"}
  - name: command_after_the_heredoc_still_counts
    verdict: match
    events:
      - {action: command.executed, command: "cat > notes.md <<'EOF'\nhello\nEOF\ncat ~/.ssh/id_rsa"}
  - name: bare_credentials_doc_file
    verdict: no_match
    events:
      - {action: file.read, path: 'C:\Users\me\project\docs\credentials'}
  - name: type_bare_credentials_doc
    verdict: no_match
    events:
      - {action: command.executed, command: 'type docs\credentials'}
