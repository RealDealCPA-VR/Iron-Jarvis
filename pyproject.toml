[project]
name = "iron-jarvis"
version = "1.207.0"
description = "Iron Jarvis - a local-first AI operating system: a multi-agent orchestrator with tools, memory, workflows, a sandbox, git-native review, and a Next.js control center."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.40", # imported directly in daemon/auth.py (security middleware)
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlmodel>=0.0.21",
    "sqlalchemy>=2.0", # imported directly in core/db.py + ~29 stores (not only via sqlmodel)
    "typer>=0.12",
    "httpx>=0.27",
    "anthropic>=0.40",
    "tomli-w>=1.0",
    "cryptography>=43",
    "rich>=13",
    "psutil>=7.2.2",
    "numpy>=2.5.0",
    "apscheduler>=3.11.2",
    "pyyaml>=6.0.3",
    "docker>=7.1.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "fpdf2>=2.8.7",
    "python-pptx>=1.0.2",
    "pillow>=11", # imported directly in documents/readers.py (image metadata)
    "playwright>=1.60.0",
    "pywinpty>=3.0.5 ; sys_platform == 'win32'",
    "paramiko>=3.4", # SSH/SFTP for the remote long-term-memory source (§21)
    "markitdown[pdf]>=0.1.6",
    "mammoth>=1.12.0",
    "pikepdf>=10.11.0",
    # Deterministic per-PAGE scan routing (v1.176.0). A Rust/PyO3 wheel (abi3,
    # win_amd64 published) with one dependency; no model, no network, ~1.5ms on
    # a 3-page file. Pinned to a minor range on purpose: it went 1.0 -> 1.14 in
    # weeks, and it decides which pages of a client document get read.
    "pdf-inspector>=1.14.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # The suite runs across CPU cores (v1.182.1). It is the release GATE — the
    # installer cannot build until it is green — so its wall time is time the
    # user waits for an update: 4814 tests took 16m14s serially here and
    # ~23min on the CI runner, which was most of a ~40min release. MEASURED at
    # -n 4: 4m35s / 4m51s / 4m34s across three runs, 4814 passed 2 skipped
    # every time, identical to serial. Nothing about WHAT is verified changes.
    # If a future test needs true isolation, mark it rather than reverting
    # this — a 3.5x slower gate is paid on every release, forever.
    "pytest-xdist>=3.6",
    "pyinstaller>=6.21",
]
# Bundled OFFLINE speech-to-text. Kept OPTIONAL (not a base dep) so a plain
# install stays lean; the packaged desktop build installs it (uv sync --extra
# voice) and the frozen daemon bundles its native lib (packaging/ironjarvis.spec
# _collect("vosk")). The daemon degrades gracefully when vosk isn't present.
voice = [
    "vosk>=0.3.45",
]

[project.scripts]
ironjarvis = "iron_jarvis.daemon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iron_jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
