<!doctype html>
<!--
  The popup is STATUS ONLY (D28). It shows connection state, access mode and the
  current tab, and offers at most two actions: Open Jarvis, and one button that
  disconnects or reconnects this browser — shown only when there is something for
  it to do, and always labelled with what it will do.

  What is deliberately absent, and must stay absent: agent chat, model selection,
  automation controls, tool settings, and any approval or confirmation surface.
  Jarvis is the product; this is a light on the dashboard of it.

  Copy rule: this add-on is never called an "extension" in anything the user reads —
  in Iron Jarvis that word already means an MCP server.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Iron Jarvis</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8eef5;
        --muted: #8fa1b5;
        --bg: #0b1016;
        --line: #1f2b38;
        --cyan: #35d0e6;
        --amber: #e0a84a;
        --green: #4fd48a;
        --dim: #5b6b7d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 268px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.4px;
        margin: 0 0 14px;
      }
      .state {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 13.5px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--dim);
        flex: none;
      }
      .state[data-tone="connected"] .dot {
        background: var(--green);
        box-shadow: 0 0 8px rgba(79, 212, 138, 0.6);
      }
      .state[data-tone="waiting"] .dot {
        background: var(--amber);
      }
      .state[data-tone="off"] .dot {
        background: var(--dim);
      }
      .note {
        color: var(--muted);
        margin: 8px 0 0;
      }
      dl {
        margin: 14px 0 0;
        padding: 12px 0 0;
        border-top: 1px solid var(--line);
      }
      dt {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }
      dd {
        margin: 3px 0 12px;
        overflow-wrap: anywhere;
      }
      dd:last-of-type {
        margin-bottom: 0;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        appearance: none;
        font: inherit;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 7px;
        cursor: pointer;
        border: 1px solid var(--line);
        background: #16202b;
        color: var(--ink);
      }
      button.primary {
        border-color: var(--cyan);
        background: rgba(53, 208, 230, 0.14);
      }
      button:hover {
        filter: brightness(1.18);
      }
    </style>
  </head>
  <body>
    <h1>Jarvis</h1>
    <div class="state" id="state" data-tone="off">
      <span class="dot" aria-hidden="true"></span>
      <span id="state-word">Checking…</span>
    </div>
    <p class="note" id="note"></p>
    <dl>
      <dt>Access</dt>
      <dd id="access">—</dd>
      <dt>Current tab</dt>
      <dd id="tab">—</dd>
    </dl>
    <div class="actions">
      <button class="primary" id="open" type="button">Open Jarvis</button>
      <!-- Empty and hidden until the worker says which action is real. A static
           "Disconnect" here is a promise the panel may be about to contradict. -->
      <button id="toggle" type="button" hidden></button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
