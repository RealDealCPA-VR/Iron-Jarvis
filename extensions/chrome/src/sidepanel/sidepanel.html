<!doctype html>
<!--
  The side panel: a WINDOW onto a conversation that runs in Iron Jarvis (D32, D33).

  It holds no agent loop, no policy and no tool settings. Everything it shows
  arrives as a `browser.panel_event` frame and everything the user presses leaves
  as a `browser.panel` action, over the socket the service worker already holds.

  ONE control lives here that D28 once kept out, by the user's decision
  (v1.267.0): the MODEL that answers in this panel. The list comes from the
  daemon (the same one every picker in Iron Jarvis reads) and a pick is
  validated there before a turn starts — the panel never carries a catalog of
  its own. The rest of D28 stands: no tool switch, no pairing control, no
  access switch; those are governed in Jarvis, on surfaces that are reviewed.

  MINIMAL BY RULE (v1.267.0). The user's words: "not too much in the way of
  instruction when the extension is opened. Super clean and minimal." So the
  chrome prints only what changes what the user can do right now — the
  connection, the access mode, the model, the composer. Every explanation
  lives in a tooltip (`title=`), never in a paragraph; the access-off state is
  one line; an approval card says what it wants and offers its answers.
  tests/test_browser_sidepanel_minimal_v1267.py counts the visible words of the
  idle panel and fails when they creep back.

  Copy rule: this add-on is never called an "extension" in anything the user reads —
  in Iron Jarvis that word already means an MCP server.

  Naming rule: the place the user goes to change any of this has ONE name, and it is
  the one the dashboard's own nav shows — "the Browser page in Iron Jarvis".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Iron Jarvis</title>
    <style>
      /* THE PANEL FOLLOWS THE BROWSER'S THEME (v1.265.0). Every colour on this
         page is a token below, so the light and the dark palette are the ONLY
         two places a colour is written: a rule that hard-codes a hex value is a
         rule that is wrong in one of the two themes, and
         tests/test_browser_addon_theme_v1265.py scans for exactly that. The light
         set is the default; the dark set applies under `prefers-color-scheme:
         dark`, which is what Edge's Appearance setting and Chrome's colour mode
         (or the operating system, when either is left on System) hand an
         extension page. `color-scheme: light dark` lets the browser paint the
         text box, the select and the scrollbar to match. The light accents are
         deliberately darker than their dark-theme cousins: #35d0e6 on white is
         decoration, not text, and the same test checks every ink-on-ground pair
         below against WCAG AA. */
      :root {
        color-scheme: light dark;
        --ink: #17212c;
        --muted: #55677a;
        --dim: #97a5b4;
        --bg: #ffffff;
        --control: #f1f5f9;
        --line: #d3dce6;
        --cyan: #0c7d90;
        --cyan-wash: rgba(12, 125, 144, 0.1);
        --amber: #8a5a0b;
        --amber-wash: rgba(138, 90, 11, 0.1);
        --green: #1a7f4b;
        --green-glow: rgba(26, 127, 75, 0.35);
        --hover: brightness(0.95);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e8eef5;
          --muted: #8fa1b5;
          --dim: #5b6b7d;
          --bg: #0b1016;
          --control: #10161e;
          --line: #1f2b38;
          --cyan: #35d0e6;
          --cyan-wash: rgba(53, 208, 230, 0.14);
          --amber: #e0a84a;
          --amber-wash: rgba(224, 168, 74, 0.14);
          --green: #4fd48a;
          --green-glow: rgba(79, 212, 138, 0.6);
          --hover: brightness(1.18);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      button {
        appearance: none;
        font: inherit;
        font-weight: 600;
        padding: 6px 11px;
        border-radius: 7px;
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--control);
        color: var(--ink);
      }
      button.primary {
        border-color: var(--cyan);
        background: var(--cyan-wash);
      }
      button.warn {
        border-color: var(--amber);
        background: var(--amber-wash);
      }
      button.link {
        border: 0;
        background: none;
        padding: 0;
        font-weight: 500;
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      button:hover {
        filter: var(--hover);
      }
      button[disabled] {
        opacity: 0.5;
        cursor: default;
        filter: none;
      }

      /* --- header: one line, plus a note only when there is one --------------- */

      header {
        flex: none;
        padding: 10px 12px 8px;
        border-bottom: 1px solid var(--line);
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .state {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        font-weight: 600;
        white-space: nowrap;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dim);
        flex: none;
      }
      .state[data-tone="connected"] .dot {
        background: var(--green);
        box-shadow: 0 0 8px var(--green-glow);
      }
      .state[data-tone="waiting"] .dot {
        background: var(--amber);
      }
      .state[data-tone="off"] .dot {
        background: var(--dim);
      }
      .pill {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 7px;
        cursor: default;
        white-space: nowrap;
      }
      #model {
        font: inherit;
        font-size: 12px;
        color: var(--ink);
        background: var(--control);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 4px 6px;
        max-width: 52%;
        min-width: 0;
      }
      #model:focus {
        outline: none;
        border-color: var(--cyan);
      }
      .note {
        color: var(--muted);
        margin: 6px 0 0;
      }
      .note:empty {
        display: none;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .actions:has(> [hidden]:only-child) {
        display: none;
      }

      /* --- transcript ------------------------------------------------------- */

      #transcript {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 12px;
      }
      .turn {
        margin: 0 0 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .turn[data-who="you"] {
        color: var(--ink);
        border-left: 2px solid var(--cyan);
        padding-left: 9px;
      }
      .turn[data-who="jarvis"] {
        color: var(--ink);
      }
      .turn[data-who="tool"] {
        color: var(--muted);
        font-size: 12px;
      }
      .turn[data-who="error"] {
        color: var(--amber);
      }
      /* A steer note is PENDING until the daemon says the turn took it. The word
         is written by sidepanel.ts, not here, so the two cannot disagree. */
      .turn[data-who="steer"] {
        color: var(--amber);
        font-size: 12px;
      }
      .turn[data-pending="true"] {
        opacity: 0.75;
      }
      #empty {
        color: var(--muted);
        padding: 2px 0;
      }
      #empty strong {
        color: var(--ink);
      }

      /* --- approval --------------------------------------------------------- */

      #approval {
        flex: none;
        margin: 0 12px 10px;
        padding: 10px 12px;
        border: 1px solid var(--amber);
        border-radius: 8px;
        background: var(--amber-wash);
      }
      #approval p {
        margin: 0 0 8px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .row button {
        padding: 5px 9px;
        font-size: 12px;
      }

      /* --- composer --------------------------------------------------------- */

      footer {
        flex: none;
        padding: 8px 12px 10px;
        border-top: 1px solid var(--line);
      }
      textarea {
        width: 100%;
        min-height: 48px;
        resize: vertical;
        font: inherit;
        color: var(--ink);
        background: var(--control);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 7px 9px;
      }
      textarea:focus {
        outline: none;
        border-color: var(--cyan);
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
      }
      .meta {
        margin-left: auto;
        color: var(--dim);
        font-size: 11px;
        white-space: nowrap;
      }

      /* Running and idle are one attribute on <body>, so every control that
         depends on the turn state is switched in one place rather than by five
         separate `hidden` writes that can disagree. */
      body[data-turn="idle"] #stop,
      body[data-turn="idle"] #steer {
        display: none;
      }
      body[data-turn="running"] #send {
        display: none;
      }
      /* Access `off` is fail-closed in the daemon; the panel says so rather than
         offering a composer that can only be refused. */
      body[data-access="off"] footer,
      body[data-access="off"] #approval {
        display: none;
      }
      body:not([data-access="off"]) #empty {
        display: none;
      }
    </style>
  </head>
  <body data-turn="idle" data-access="unknown">
    <header>
      <div class="bar">
        <div class="state" id="state" data-tone="off">
          <span class="dot" aria-hidden="true"></span>
          <span id="state-word">Checking…</span>
          <!-- The access mode as a pill. Its tooltip is the whole explanation
               (`modeHint` in sidepanel.ts) — the sentence used to be a paragraph
               under the header on every open. -->
          <span class="pill" id="access" title="">—</span>
          <!-- v1.266.0: whether the tab the user is looking at holds an approval
               grant. Painted from the daemon's `state` frame (`tab_allowed`);
               hidden until the daemon says so, re-asked on a tab switch. -->
          <span class="pill" id="tab-allowed" hidden title="Page actions in this tab run without asking until it closes.">Tab allowed</span>
        </div>
        <!-- v1.267.0: THE MODEL. Filled from the daemon's `models` frame; the
             Default option names the model Jarvis would use anyway. A pick is
             remembered in this browser and validated by the daemon on Send. -->
        <select id="model" aria-label="Model" title="The model that answers in this panel">
          <option value="">Default</option>
        </select>
      </div>
      <p class="note" id="note"></p>
      <div class="actions">
        <!-- Empty and hidden until the worker says which action is real. A static
             "Disconnect" here is a promise the header may be about to contradict. -->
        <button id="toggle" type="button" hidden></button>
      </div>
    </header>

    <div id="transcript">
      <div id="empty">
        <strong>Browser access is off.</strong> This panel can run nothing until you turn it on
        from the Browser page in Iron Jarvis.
      </div>
    </div>

    <!-- Empty and hidden until an acting tool actually asks. A card sitting here
         with placeholder words is a card the user learns to click through. -->
    <div id="approval" hidden>
      <p id="approval-text"></p>
      <div class="row">
        <!-- v1.266.0: ONE APPROVAL PER TAB. Answers with the "tab" decision: this
             call runs, and every later page action in this same tab runs without
             a card until the tab closes (or the browser restarts, or Forget). The
             risk cards — a payment, a password, a "delete" — still ask. -->
        <button class="primary" id="approve-tab" type="button" title="This action runs, and every later page action in this tab runs without asking until the tab closes. Payments, passwords and deletions still ask.">Allow for this tab</button>
        <button id="approve" type="button" title="Runs this one action.">Allow once</button>
        <!-- v1.262.0: one press for the rest of THIS task. It answers the card
             with the chat lane's "conversation" grant, which covers the remaining
             rounds of this turn only — the next message asks again. -->
        <button id="approve-task" type="button" title="Covers the rest of this message. The next message asks again.">Allow for this task</button>
        <button id="deny" type="button" title="Refuses this action; Jarvis is told you declined.">Deny</button>
      </div>
    </div>

    <footer>
      <!-- v1.264.0's keyboard contract, now in the tooltip: Enter sends (Steer
           while Jarvis is working) · Shift+Enter starts a new line. -->
      <textarea id="ask" rows="2" placeholder="Ask about this page…" title="Enter sends (Steer while Jarvis is working) · Shift+Enter starts a new line"></textarea>
      <div class="controls">
        <button class="primary" id="send" type="button">Send</button>
        <button class="warn" id="stop" type="button" title="Stop prevents the next step. A tool that is already running finishes, and what it wrote stays written.">Stop</button>
        <button id="steer" type="button" title="Adds a note the turn picks up at its next step — it cannot interrupt a sentence already being written.">Steer</button>
        <!-- WHICH COPY of the add-on the browser is running. Chrome keeps serving
             the build it loaded until somebody presses Reload, so after an app
             update this number is the only thing that tells a stale add-on from a
             current one. Read from the manifest, never a constant written here. -->
        <span class="meta">Add-on <span id="version">—</span> · <button class="link" id="open" type="button">Open Jarvis</button></span>
      </div>
    </footer>
    <script src="sidepanel.js"></script>
  </body>
</html>
