<!doctype html>
<!--
  The side panel: a WINDOW onto a conversation that runs in Iron Jarvis (D32, D33).

  It holds no agent loop, no policy and no tool settings. Everything it shows
  arrives as a `browser.panel_event` frame and everything the user presses leaves
  as a `browser.panel` action, over the socket the service worker already holds.

  ONE control lives here that D28 once kept out, by the user's decision
  (v1.267.0): the MODEL that answers in this panel. The list comes from the
  daemon (the same one every picker in Iron Jarvis reads) and a pick is
  validated there before a turn starts — the panel never carries a catalog of
  its own. The rest of D28 stands: no tool switch, no pairing control, no
  access switch; those are governed in Jarvis, on surfaces that are reviewed.

  MINIMAL BY RULE (v1.267.0). The chrome prints only what changes what the user
  can do right now. Every explanation lives in a tooltip (`title=`), never in a
  paragraph; the access-off state is one line.
  tests/test_browser_sidepanel_minimal_v1267.py counts the visible words.

  THE APP'S LOOK, SLEEK (v1.268.0): the arc-reactor accent, soft translucent
  lines, an accent bloom on the ground, bubbles, one rounded composer, pill
  buttons. tests/test_browser_sidepanel_look_v1268.py pins the structure.

  THE TOP IS THE MARK; THE CONTROLS ARE IN THE COMPOSER (v1.269.0). "Clean up
  the view at the top, it's very busy" — the header is now the Iron Jarvis
  reactor mark (the same drawing the app's sidebar and Overview use, as inline
  SVG) with the connection dot on it, the state word beside it in small type,
  and the access pill. The model picker moved to the bottom right of the
  composer as a small icon: the same `<select id="model">` sits invisibly over
  it, so the native list opens on click and the tooltip names the pick. Next
  to it, ONE button with two jobs: the microphone when nothing is typed, the
  send arrow as soon as there are words, a stop square while listening.
  Dictation goes through Iron Jarvis's own speech engine, never a browser
  vendor's — see sidepanel.ts.

  IT REMEMBERS, IT HAS ONE SWITCH, AND THE WORK IS FOLDED (v1.270.0). The
  conversation lives in the daemon and is replayed into an empty transcript on
  `open` (the `history` frame); the `+` icon in the header starts a new one.
  The header's Auto-allow switch (`#auto`, shown at Interactive) is the ONE
  control for the ordinary approval cards: on, page actions run without a card;
  off, the card is Allow · Always allow · Deny. Payments, passwords, deletions
  and pages that tried to instruct Jarvis still ask — that floor is the
  daemon's, not this page's. Each turn's steps fold into a collapsed
  <details class="work"> whose summary reads "Working · <the latest step>"
  while a turn runs and "N steps" after; the user expands it if they choose.
  A route notice (a failover, the mock) stays a visible line.

  Copy rule: this add-on is never called an "extension" in anything the user reads —
  in Iron Jarvis that word already means an MCP server.

  Naming rule: the place the user goes to change any of this has ONE name, and it is
  the one the dashboard's own nav shows — "the Browser page in Iron Jarvis".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Iron Jarvis</title>
    <style>
      /* THE PANEL FOLLOWS THE BROWSER'S THEME (v1.265.0). Every colour on this
         page is a token below, so the light and the dark palette are the ONLY
         two places a colour is written: a rule that hard-codes a hex value is a
         rule that is wrong in one of the two themes, and
         tests/test_browser_addon_theme_v1265.py scans for exactly that. The light
         set is the default; the dark set applies under `prefers-color-scheme:
         dark`. `color-scheme: light dark` lets the browser paint the text box,
         the select and the scrollbar to match. Text-bearing tokens clear WCAG AA
         on the ground in both themes (the theme test measures it): the light
         accent is the dashboard's DEEP light accent for that reason — the bright
         one is for fills and glow, not for words. */
      :root {
        color-scheme: light dark;
        --ink: #17212c;
        --muted: #55677a;
        --dim: #97a5b4;
        --bg: #ffffff;
        --surface: #f4f7fb;
        --surface-2: #e9eef5;
        --line: rgba(23, 33, 44, 0.1);
        --shadow: rgba(23, 33, 44, 0.08);
        --cyan: #0054be;
        --cyan-soft: #0071eb;
        --cyan-wash: rgba(0, 113, 235, 0.1);
        --cyan-glow: rgba(0, 113, 235, 0.14);
        --on-cyan: #ffffff;
        --amber: #8a5a0b;
        --amber-wash: rgba(138, 90, 11, 0.1);
        --green: #1a7f4b;
        --green-glow: rgba(26, 127, 75, 0.35);
        --hover: brightness(0.96);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e8eef5;
          --muted: #8fa1b5;
          --dim: #5b6b7d;
          --bg: #0a0f14;
          --surface: #111821;
          --surface-2: #18212c;
          --line: rgba(232, 238, 245, 0.08);
          --shadow: rgba(0, 0, 0, 0.35);
          --cyan: #22d3ee;
          --cyan-soft: #67e8f9;
          --cyan-wash: rgba(34, 211, 238, 0.12);
          --cyan-glow: rgba(34, 211, 238, 0.16);
          --on-cyan: #0a0f14;
          --amber: #e0a84a;
          --amber-wash: rgba(224, 168, 74, 0.14);
          --green: #4fd48a;
          --green-glow: rgba(79, 212, 138, 0.6);
          --hover: brightness(1.15);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        margin: 0;
        /* The arc-reactor glow the dashboard's ground carries, in miniature:
           one soft accent bloom at the top, then the plain ground. */
        background:
          radial-gradient(70% 38% at 30% 0%, var(--cyan-glow), transparent 70%),
          var(--bg);
        color: var(--ink);
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button {
        appearance: none;
        font: inherit;
        font-weight: 600;
        padding: 6px 13px;
        border-radius: 999px;
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        transition: filter 120ms ease, transform 120ms ease;
      }
      button.primary {
        border-color: transparent;
        background: var(--cyan);
        color: var(--on-cyan);
      }
      button.warn {
        border-color: var(--amber);
        background: var(--amber-wash);
        color: var(--ink);
      }
      button.ghost {
        background: transparent;
      }
      button.link {
        border: 0;
        background: none;
        padding: 0;
        font-weight: 500;
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      button:hover {
        filter: var(--hover);
      }
      button:active {
        transform: translateY(1px);
      }
      button[disabled] {
        opacity: 0.5;
        cursor: default;
        filter: none;
      }
      .icon {
        width: 16px;
        height: 16px;
        display: block;
      }

      /* --- header: the mark, the state, the mode; no divider --------------------- */

      header {
        flex: none;
        padding: 10px 12px 4px;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .state {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        white-space: nowrap;
      }
      /* The arc-reactor mark: the app's own drawing (Sidebar.tsx ArcMark), as
         inline SVG that takes its colour from `currentColor`. */
      .brand {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--cyan);
      }
      .mark {
        width: 24px;
        height: 24px;
        filter: drop-shadow(0 0 6px var(--cyan-glow));
      }
      .mark .core {
        fill: var(--cyan-wash);
      }
      .mark .pupil {
        fill: var(--cyan-soft);
      }
      .wordmark {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: var(--cyan);
      }
      .dot {
        position: absolute;
        right: -3px;
        bottom: -2px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dim);
        border: 2px solid var(--bg);
        box-sizing: content-box;
      }
      .state[data-tone="connected"] .dot {
        background: var(--green);
        box-shadow: 0 0 8px var(--green-glow);
      }
      .state[data-tone="waiting"] .dot {
        background: var(--amber);
      }
      .state[data-tone="off"] .dot {
        background: var(--dim);
      }
      .word {
        font-size: 11.5px;
        font-weight: 500;
        color: var(--muted);
      }
      .pill {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--muted);
        background: var(--surface-2);
        border-radius: 999px;
        padding: 2px 8px;
        cursor: default;
        white-space: nowrap;
      }
      .pill-accent {
        color: var(--cyan);
        background: var(--cyan-wash);
      }
      .spacer {
        margin-left: auto;
      }
      /* THE ONE SWITCH (v1.270.0): a pill with a knob. `aria-checked` is painted
         from the daemon's `state` frame, so it shows a fact. */
      .switch {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px 2px 3px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .switch .knob {
        position: relative;
        width: 22px;
        height: 12px;
        border-radius: 999px;
        background: var(--dim);
        transition: background 120ms ease;
      }
      .switch .knob::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--bg);
        transition: transform 120ms ease;
      }
      .switch[aria-checked="true"] {
        color: var(--cyan);
        background: var(--cyan-wash);
        border-color: transparent;
      }
      .switch[aria-checked="true"] .knob {
        background: var(--cyan);
      }
      .switch[aria-checked="true"] .knob::after {
        transform: translateX(10px);
      }
      /* Nothing to allow at Read only or Off: the switch is not drawn. */
      body:not([data-access="interactive"]) #auto {
        display: none;
      }
      /* With the switch on, "Tab allowed" says nothing the switch does not. */
      body[data-auto="on"] #tab-allowed {
        display: none;
      }
      /* The new-conversation icon (v1.270.0). Hidden while a turn runs: the
         daemon refuses a reset then, and a button that is refused is noise. */
      .iconbtn {
        width: 26px;
        height: 26px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 0;
        background: transparent;
        color: var(--muted);
      }
      .iconbtn:hover {
        color: var(--cyan);
        background: var(--cyan-wash);
      }
      body[data-turn="running"] #reset {
        display: none;
      }
      .note {
        color: var(--muted);
        margin: 8px 2px 0;
      }
      .note:empty {
        display: none;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .actions:not(:has(> button:not([hidden]))) {
        display: none;
      }

      /* --- transcript: bubbles ---------------------------------------------- */

      #transcript {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 8px 12px 12px;
        display: flex;
        flex-direction: column;
      }
      .turn {
        margin: 0 0 8px;
        max-width: 88%;
        padding: 8px 12px;
        border-radius: 16px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.5;
      }
      .turn[data-who="you"] {
        margin-left: auto;
        color: var(--ink);
        background: var(--cyan-wash);
        border: 1px solid var(--line);
        border-bottom-right-radius: 5px;
      }
      .turn[data-who="jarvis"] {
        margin-right: auto;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line);
        border-bottom-left-radius: 5px;
      }
      .turn[data-who="tool"] {
        max-width: 100%;
        padding: 2px 4px;
        color: var(--muted);
        font-size: 11.5px;
      }
      .turn[data-who="error"] {
        margin-right: auto;
        color: var(--amber);
        background: var(--amber-wash);
        border-bottom-left-radius: 5px;
      }
      /* A steer note is PENDING until the daemon says the turn took it. The word
         is written by sidepanel.ts, not here, so the two cannot disagree. */
      .turn[data-who="steer"] {
        max-width: 100%;
        padding: 2px 4px;
        color: var(--amber);
        font-size: 11.5px;
      }
      .turn[data-pending="true"] {
        opacity: 0.7;
      }
      /* THE WORK, FOLDED (v1.270.0): one <details> per turn, collapsed; the
         summary is the latest step while the turn runs and the count after.
         Built by sidepanel.ts, never written here. */
      .work {
        max-width: 100%;
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 11.5px;
      }
      .work summary {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 6px;
        border-radius: 8px;
        list-style: none;
        cursor: pointer;
        user-select: none;
      }
      .work summary::-webkit-details-marker {
        display: none;
      }
      .work summary::before {
        content: "";
        width: 0;
        height: 0;
        border-left: 4px solid var(--dim);
        border-top: 3.5px solid transparent;
        border-bottom: 3.5px solid transparent;
        transition: transform 120ms ease;
      }
      .work[open] summary::before {
        transform: rotate(90deg);
      }
      .work[data-live="true"] summary::before {
        border-left-color: var(--cyan);
      }
      .work summary:hover {
        background: var(--surface);
      }
      .work .step {
        padding: 1px 6px 1px 20px;
        overflow-wrap: anywhere;
      }
      .work .step[data-ok="false"] {
        color: var(--amber);
      }
      #empty {
        color: var(--muted);
        padding: 4px 2px;
      }
      #empty strong {
        color: var(--ink);
      }

      /* --- approval --------------------------------------------------------- */

      #approval {
        flex: none;
        margin: 0 12px 10px;
        padding: 10px 12px 11px;
        border-radius: 14px;
        background: var(--amber-wash);
        border: 1px solid var(--line);
      }
      #approval p {
        margin: 0 0 8px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .row button {
        padding: 5px 11px;
        font-size: 12px;
      }

      /* --- composer: one rounded card; the model icon and the mic/send at its corner */

      footer {
        flex: none;
        padding: 0 12px 10px;
      }
      .composer {
        border-radius: 16px;
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: 0 6px 20px var(--shadow);
        padding: 8px 8px 6px 10px;
      }
      .composer:focus-within {
        border-color: var(--cyan);
      }
      textarea {
        display: block;
        width: 100%;
        min-height: 44px;
        max-height: 160px;
        resize: none;
        font: inherit;
        color: var(--ink);
        background: transparent;
        border: 0;
        padding: 4px 4px 2px;
      }
      textarea:focus {
        outline: none;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      /* The model icon, with the real select laid invisibly over it so the
         native list opens on click and the keyboard still works. */
      .model-pick {
        position: relative;
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 999px;
        color: var(--muted);
      }
      .model-pick:hover {
        color: var(--cyan);
        background: var(--cyan-wash);
      }
      #model {
        appearance: none;
        -webkit-appearance: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
      }
      #model:focus-visible + .icon {
        color: var(--cyan);
      }
      /* The one button with two jobs. `data-mode` is painted by the panel from
         the box's content; `body[data-voice]` from the dictation state. */
      #send {
        width: 32px;
        height: 32px;
        padding: 0;
        display: grid;
        place-items: center;
      }
      #send .icon {
        display: none;
      }
      #send[data-mode="mic"] .icon-mic,
      #send[data-mode="send"] .icon-send,
      #send[data-mode="stop"] .icon-stop {
        display: block;
      }
      body[data-voice="listening"] #send {
        animation: listening 1.4s ease-in-out infinite;
      }
      @keyframes listening {
        0%,
        100% {
          box-shadow: 0 0 0 0 var(--cyan-glow);
        }
        50% {
          box-shadow: 0 0 0 7px var(--cyan-glow);
        }
      }
      body[data-voice="transcribing"] #send,
      #send[data-voice-off="true"] {
        opacity: 0.55;
      }
      .meta {
        margin: 6px 4px 0;
        color: var(--dim);
        font-size: 10.5px;
        text-align: right;
      }

      /* Running and idle are one attribute on <body>, so every control that
         depends on the turn state is switched in one place rather than by five
         separate `hidden` writes that can disagree. */
      body[data-turn="idle"] #stop,
      body[data-turn="idle"] #steer {
        display: none;
      }
      body[data-turn="running"] #send {
        display: none;
      }
      /* Access `off` is fail-closed in the daemon; the panel says so rather than
         offering a composer that can only be refused. */
      body[data-access="off"] footer,
      body[data-access="off"] #approval {
        display: none;
      }
      body:not([data-access="off"]) #empty {
        display: none;
      }
    </style>
  </head>
  <body data-turn="idle" data-access="unknown" data-voice="idle" data-auto="off">
    <header>
      <div class="bar">
        <div class="state" id="state" data-tone="off">
          <!-- The app's own arc-reactor mark (Sidebar.tsx / the Overview), with
               the connection dot on its corner. -->
          <span class="brand" title="Iron Jarvis">
            <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <circle cx="12" cy="12" r="9.2" stroke-width="1.2" opacity="0.3" />
              <g stroke-width="1.1" stroke-linecap="round" opacity="0.7">
                <line x1="16.4" y1="12" x2="19.6" y2="12" />
                <line x1="15.11" y1="15.11" x2="17.37" y2="17.37" />
                <line x1="12" y1="16.4" x2="12" y2="19.6" />
                <line x1="8.89" y1="15.11" x2="6.63" y2="17.37" />
                <line x1="7.6" y1="12" x2="4.4" y2="12" />
                <line x1="8.89" y1="8.89" x2="6.63" y2="6.63" />
                <line x1="12" y1="7.6" x2="12" y2="4.4" />
                <line x1="15.11" y1="8.89" x2="17.37" y2="6.63" />
              </g>
              <circle class="core" cx="12" cy="12" r="3.4" stroke-width="1.3" />
              <circle class="pupil" cx="12" cy="12" r="1.2" stroke="none" />
            </svg>
            <span class="wordmark">IJ</span>
            <span class="dot" aria-hidden="true"></span>
          </span>
          <span class="word" id="state-word">Checking…</span>
        </div>
        <span class="spacer"></span>
        <!-- The access mode as a pill. Its tooltip is the whole explanation
             (`modeHint` in sidepanel.ts). -->
        <span class="pill" id="access" title="">—</span>
        <!-- v1.266.0: whether the tab the user is looking at holds an approval
             grant. Painted from the daemon's `state` frame (`tab_allowed`);
             hidden until the daemon says so, re-asked on a tab switch. -->
        <span class="pill pill-accent" id="tab-allowed" hidden title="Page actions in this tab run without asking until it closes.">Tab allowed</span>
        <!-- v1.270.0: THE ONE SWITCH. On, page actions run without a card; off,
             each asks. Payments, passwords, deletions and a page that tried to
             instruct Jarvis still ask either way — the daemon's floor. Painted
             from the daemon's `state` frame; the setting is remembered in this
             browser and re-asserted on every open. -->
        <button class="switch" id="auto" type="button" role="switch" aria-checked="false" title="Auto-allow: on, Jarvis acts on pages without asking each time. Payments, passwords, deletions and pages that tried to instruct Jarvis still ask.">
          <span class="knob" aria-hidden="true"></span>
          <span>Auto-allow</span>
        </button>
        <!-- v1.270.0: a new conversation. The daemon forgets this one. -->
        <button class="iconbtn" id="reset" type="button" title="New conversation — Jarvis forgets this one" aria-label="New conversation">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5 4v-4H6.5A2.5 2.5 0 0 1 4 13.5z" />
            <path d="M12 6.8v5.4M9.3 9.5h5.4" />
          </svg>
        </button>
      </div>
      <p class="note" id="note"></p>
      <div class="actions">
        <!-- v1.274.0: shown only while connected WITHOUT the site grant. One press
             opens the add-on's own setup page, where the browser asks. -->
        <button class="primary" id="grant" type="button" hidden title="Opens the add-on's site-access page, where your browser asks once.">Grant site access</button>
        <!-- Empty and hidden until the worker says which action is real. A static
             "Disconnect" here is a promise the header may be about to contradict. -->
        <button class="ghost" id="toggle" type="button" hidden></button>
      </div>
    </header>

    <div id="transcript">
      <div id="empty">
        <strong>Browser access is off.</strong> This panel can run nothing until you turn it on
        from the Browser page in Iron Jarvis.
      </div>
    </div>

    <!-- Empty and hidden until an acting tool actually asks. A card sitting here
         with placeholder words is a card the user learns to click through. -->
    <div id="approval" hidden>
      <p id="approval-text"></p>
      <div class="row">
        <button class="primary" id="approve" type="button" title="Runs this one action.">Allow</button>
        <!-- v1.270.0: the switch, from the card. This action runs and Auto-allow
             turns on, so nothing asks again until you turn it off. The daemon's
             "tab" and "task" scopes still exist for the chat page's card; the
             sidebar offers ONE wider answer, the one the user asked for. -->
        <button id="approve-always" type="button" title="Runs this action and turns Auto-allow on: page actions stop asking until you turn it off. Payments, passwords and deletions still ask.">Always allow</button>
        <button class="ghost" id="deny" type="button" title="Refuses this action; Jarvis is told you declined.">Deny</button>
      </div>
    </div>

    <footer>
      <div class="composer">
        <!-- v1.264.0's keyboard contract, in the tooltip: Enter sends (Steer
             while Jarvis is working) · Shift+Enter starts a new line. -->
        <textarea id="ask" rows="2" placeholder="Ask about this page…" title="Enter sends (Steer while Jarvis is working) · Shift+Enter starts a new line · Esc stops"></textarea>
        <div class="controls">
          <button class="warn" id="stop" type="button" title="Stop prevents the next step. A tool that is already running finishes, and what it wrote stays written.">Stop</button>
          <button class="ghost" id="steer" type="button" title="Adds a note the turn picks up at its next step — it cannot interrupt a sentence already being written.">Steer</button>
          <span class="spacer"></span>
          <!-- v1.267.0/v1.269.0: THE MODEL, as a small icon. The select below is
               the real control, laid invisibly over the icon: filled from the
               daemon's `models` frame, Default names the model Jarvis would use,
               the pick is remembered in this browser and shown in the tooltip. -->
          <span class="model-pick">
            <select id="model" aria-label="Model" title="Model">
              <option value="">Default</option>
            </select>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3l1.9 4.8 4.8 1.9-4.8 1.9L12 16.4l-1.9-4.8-4.8-1.9 4.8-1.9z" />
              <path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z" />
            </svg>
          </span>
          <!-- v1.269.0: ONE BUTTON, TWO JOBS. The microphone when the box is
               empty, the send arrow as soon as there are words, a stop square
               while listening. The panel paints `data-mode`; the press decides
               from the box's content. -->
          <button class="primary" id="send" type="button" data-mode="mic" title="Dictate — Iron Jarvis writes what you say into the box">
            <svg class="icon icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3" />
              <path d="M5 11a7 7 0 0 0 14 0" />
              <path d="M12 18v3" />
            </svg>
            <svg class="icon icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h13" />
              <path d="M12 6l6 6-6 6" />
            </svg>
            <svg class="icon icon-stop" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
              <rect x="7" y="7" width="10" height="10" rx="2.5" />
            </svg>
          </button>
        </div>
      </div>
      <!-- WHICH COPY of the add-on the browser is running. Chrome keeps serving
           the build it loaded until somebody presses Reload, so after an app
           update this number is the only thing that tells a stale add-on from a
           current one. Read from the manifest, never a constant written here. -->
      <p class="meta">Add-on <span id="version">—</span> · <button class="link" id="open" type="button">Open Jarvis</button></p>
    </footer>
    <script src="sidepanel.js"></script>
  </body>
</html>
